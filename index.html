<head>

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" crossorigin></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body, html {
      margin: 0;
      padding: 0;
      background-color: #070b14;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html, body, #root { width: 100%; max-width: 100%; overflow-x: hidden; }
    #root { min-height: 100vh; }
    h1, h2, h3, p { overflow-wrap: anywhere; }
    @media print {
      .tno-top, .tno-head, .tno-nav, .tno-kpis, #sync-badge { display: none !important; }
      .tno-root, .tno-shell, .tno-main { position: static !important; height: auto !important; overflow: visible !important; display: block !important; zoom: 1 !important; padding: 0 !important; }
      html, body { overflow: visible !important; height: auto !important; background: #fff !important; }
    }
    #sync-badge { bottom: 76px !important; }
    @media (min-width: 1024px) { #sync-badge { bottom: 8px !important; } }
    .tno-seal { width: 72px; height: 72px; object-fit: contain; filter: drop-shadow(0 3px 5px rgba(15,23,42,.30)); }
    .tno-seal-emoji { display: block; font-size: 54px; line-height: 72px; text-align: center; }
    @media (min-width: 1024px) { .tno-seal { width: 92px; height: 92px; } .tno-seal-emoji { font-size: 68px; line-height: 92px; } }
    .tno-kpis, .tno-deskonly { display: none; }
    @keyframes tnoFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (min-width: 1024px) {
      .tno-root { background: #e9eef5 !important; user-select: text !important; }
      .tno-shell { display: grid !important; grid-template-columns: 260px minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); max-width: none !important; width: 100% !important; border: 0 !important; background: #eef2f7 !important; box-shadow: none !important; }
      .tno-top { grid-column: 1 / -1; grid-row: 1; padding: 12px 36px !important; font-size: 13px !important; }
      .tno-head { grid-column: 1 / -1; grid-row: 2; padding: 20px 44px !important; }
      .tno-head h1 { font-size: 28px !important; }

      .tno-nav::before { content: "MENÚ DEL TORNEO"; font-size: 11px; font-weight: 900; letter-spacing: .14em; color: #64748b; padding: 0 12px 10px; }

<body class="bg-[#070b14] text-slate-900">
  <div id="root"></div>

  <script>
    (function () {
      const h = React.createElement;
      const { useState, useEffect, useMemo } = React;

      // Motor de persistencia definitiva para Google Sites (CacheStorage + IndexedDB + localStorage + window.name)
      const CACHE_STORAGE_NAME = "tno_copa_corporativa_cache_v5";
      const CACHE_STORAGE_URL = "https://tno.futbol.local/state.json";
      const MEMORY_CACHE = {};
      const STATE_LISTENERS = {};

      function getWindowNameStore() {
        try {
          const raw = window.name || "";
          if (raw.indexOf("__TNO_STORE__:") === 0) {
            return JSON.parse(decodeURIComponent(raw.substring(14)));
          }
        } catch (e) {}
        try {
          if (window.parent && window.parent !== window && window.parent.name && window.parent.name.indexOf("__TNO_STORE__:") === 0) {
            return JSON.parse(decodeURIComponent(window.parent.name.substring(14)));
          }
        } catch (e) {}
        return {};
      }

      function setWindowNameStore(key, val) {
        if (key === "copa_users_v2") return;
        try {
          const current = getWindowNameStore();
          current[key] = val;
          const encoded = "__TNO_STORE__:" + encodeURIComponent(JSON.stringify(current));
          window.name = encoded;
        } catch (e) {}
      }

      // Guardado en CacheStorage API del navegador (persiste incluso en iframes de Google Sites)
      var _cacheTimer = null;
      function cacheStorageSaveAll() {
        clearTimeout(_cacheTimer);
        _cacheTimer = setTimeout(cacheStorageSaveNow, 400);
      }
      function cacheStorageSaveNow() {
        try {
          if (!window.caches) return;
          const snapshot = JSON.stringify(MEMORY_CACHE);
          window.caches.open(CACHE_STORAGE_NAME).then(function (cache) {
            const resp = new Response(snapshot, {
              headers: { "Content-Type": "application/json" }
            });
            cache.put(CACHE_STORAGE_URL, resp);
          }).catch(function () {});
        } catch (e) {}
      }

      function cacheStorageLoadAll() {
        return new Promise(function (resolve) {
          try {
            if (!window.caches) return resolve({});
            window.caches.open(CACHE_STORAGE_NAME).then(function (cache) {
              return cache.match(CACHE_STORAGE_URL);
            }).then(function (resp) {
              if (!resp) return resolve({});
              return resp.json();
            }).then(function (data) {
              resolve(data || {});
            }).catch(function () {
              resolve({});
            });
          } catch (e) {
            resolve({});
          }
        });
      }

      // Base de datos IndexedDB nativa del navegador (resiste recargas en iframes)
      function idbSave(key, val) {
        try {
          if (!window.indexedDB) return;
          const req = window.indexedDB.open("TNO_COPA_DB_2026", 1);
          req.onupgradeneeded = function (ev) {
            const db = ev.target.result;
            if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
          };
          req.onsuccess = function (ev) {
            try {
              const db = ev.target.result;
              const tx = db.transaction("kv", "readwrite");
              tx.objectStore("kv").put(val, key);
              tx.oncomplete = function () { db.close(); };
            } catch (err) {}
          };
        } catch (e) {}
      }

      function idbLoadAllPromise() {
        return new Promise(function (resolve) {
          try {
            if (!window.indexedDB) return resolve({});
            const req = window.indexedDB.open("TNO_COPA_DB_2026", 1);
            req.onupgradeneeded = function (ev) {
              const db = ev.target.result;
              if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
            };
            req.onsuccess = function (ev) {
              try {
                const db = ev.target.result;
                const tx = db.transaction("kv", "readonly");
                const store = tx.objectStore("kv");
                const result = {};
                const keysReq = store.getAllKeys();
                const valsReq = store.getAll();
                keysReq.onsuccess = function () {
                  valsReq.onsuccess = function () {
                    const keys = keysReq.result || [];
                    const vals = valsReq.result || [];
                    keys.forEach(function (k, i) { result[k] = vals[i]; });
                    resolve(result);
                  };
                  valsReq.onerror = function () { resolve({}); };
                };
                keysReq.onerror = function () { resolve({}); };
              } catch (err) {
                resolve({});
              }
            };
            req.onerror = function () { resolve({}); };
          } catch (e) {
            resolve({});
          }
        });
      }

      function safeGetStorage(key, fallback) {
        if (MEMORY_CACHE[key] !== undefined) return MEMORY_CACHE[key];
        try {
          const item = window.localStorage.getItem(key);
          if (item !== null) {
            const parsed = JSON.parse(item);
            MEMORY_CACHE[key] = parsed;
            return parsed;
          }
        } catch (err) {}
        try {
          const wStore = getWindowNameStore();
          if (wStore[key] !== undefined) {
            MEMORY_CACHE[key] = wStore[key];
            return wStore[key];
          }
        } catch (err) {}
        try {
          const sItem = window.sessionStorage.getItem(key);
          if (sItem !== null) {
            const parsed = JSON.parse(sItem);
            MEMORY_CACHE[key] = parsed;
            return parsed;
          }
        } catch (err) {}
        return fallback;
      }

      function setSyncStatus(kind, extra) {
        var el = document.getElementById("sync-badge");
        if (!el) {
          el = document.createElement("div");
          el.id = "sync-badge";
          el.style.cssText = "position:fixed;left:6px;bottom:6px;z-index:99999;font:600 10px sans-serif;padding:3px 8px;border-radius:999px;color:#fff;opacity:.92;max-width:92vw";
          el.onclick = function () { el.style.display = "none"; };
          document.body.appendChild(el);
        }
        var t = {
          none: ["☁️ Nube no configurada: datos no compartidos", "#b45309"],
          ok: ["☁️ Sincronizado " + new Date().toTimeString().slice(0, 5), "#047857"],
          err: ["⚠️ Sin conexión con la nube, reintentando", "#b91c1c"],
          key: ["⚠️ Clave de la nube incorrecta: actualiza el script de Google", "#b91c1c"],
          nolocal: ["⚠️ Este navegador no guarda datos y la nube no está configurada", "#b91c1c"]
        }[kind];
        el.textContent = t[0] + (extra || "");
        el.style.background = t[1];
        el.style.display = "block";
        clearTimeout(el._t);
        if (kind === "ok") el._t = setTimeout(function () { el.style.display = "none"; }, 4000);
      }

      // ===== SINCRONIZACIÓN CON GOOGLE APPS SCRIPT (datos compartidos y permanentes) =====
      var BACKEND_URL = "https://script.google.com/macros/s/AKfycbxGtZhxi2Z6EakEAaWtXotlLnkxZ4SbLhUHiDX3-aKYsg79eGbJL85bJBKkR5VV5PiWVA/exec"; // pega aquí la URL de la Web App (termina en /exec)
      var SYNC_KEY = "0cIzIaIgjjLj";    // misma clave que en el script
      var SYNC_KEYS = ["copa_teams_v2","copa_matches_v2","copa_qf1_v2","copa_qf2_v2","copa_qf3_v2","copa_qf4_v2","copa_semi1_v2","copa_semi2_v2","copa_final_v2","copa_unlock_playoffs_v2","copa_captain_edit_locked_v2","copa_third_v2","copa_news_v2","copa_rules_v2","copa_sponsors_v2"];
      var CHAMP = "";
      var BRAND_GENERAL = { code: "COPA", title: "Campeonatos", sub: "Plataforma de torneos" };
      var BRAND = BRAND_GENERAL;
      function deriveCode(n) {
        var w = String(n || "").trim().split(/\s+/).filter(Boolean);
        var c = w.length > 1 ? w.map(function (x) { return x[0]; }).join("") : (w[0] || "").slice(0, 3);
        return (c || "COPA").toUpperCase().slice(0, 4);
      }
      function ck(k) { return (CHAMP && CHAMP !== "principal" && SYNC_KEYS.indexOf(k) >= 0) ? k + "@" + CHAMP : k; }
      function isSync(k) { return k === "copa_champs_v2" || k === "copa_users_v2" || SYNC_KEYS.indexOf(String(k).split("@")[0]) >= 0; }
      var KEY_TS = {};
      var USERS_FORCE = false;
      function unionUsers(first, second) {
        var m = {}, order = [];
        (first || []).concat(second || []).forEach(function (u) { var k = String(u.email).toLowerCase(); if (!(k in m)) order.push(k); m[k] = u; });
        return order.map(function (k) { return m[k]; });
      }
      function flash(msg) {
        var el = document.getElementById("flash-msg");
        if (!el) {
          el = document.createElement("div");
          el.id = "flash-msg";
          el.style.cssText = "position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:100000;background:#0f172a;color:#fff;font:700 12px sans-serif;padding:8px 14px;border-radius:12px;max-width:92vw;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.3)";
          document.body.appendChild(el);
        }
        el.textContent = msg; el.style.display = "block";
        clearTimeout(el._t); el._t = setTimeout(function () { el.style.display = "none"; }, 6000);
      }
      function sendMail(tipo, to, nombre, extra) {
        if (!BACKEND_URL) { flash("ℹ️ Correo no enviado: la nube no está configurada"); return; }
        fetch(BACKEND_URL, { method: "POST", body: JSON.stringify({ key: SYNC_KEY, action: "mail", tipo: tipo, to: to, nombre: nombre, extra: extra || "" }) })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res && res.ok && res.correo) flash("📧 Correo de confirmación enviado a " + to);
            else if (res && res.error === "limite") flash("⚠️ Se alcanzó el límite diario de correos");
            else flash("⚠️ No se pudo enviar el correo (actualiza el script de Google)");
          })
          .catch(function () { flash("⚠️ No se pudo enviar el correo"); });
      }
      var PENDING = {};
      var pushTimer = null;

      function persistLocal(key, value) {
        MEMORY_CACHE[key] = value;
        var serialized = JSON.stringify(value);
        setWindowNameStore(key, value);
        idbSave(key, value);
        try { window.localStorage.setItem(key, serialized); } catch (err) {}
        try { window.sessionStorage.setItem(key, serialized); } catch (err) {}
        cacheStorageSaveAll();
      }

      function safeSetStorage(key, value) {
        persistLocal(key, value);
        if (BACKEND_URL && isSync(key)) {
          KEY_TS[key] = Date.now();
          persistLocal("copa_key_ts_v2", KEY_TS);
          PENDING[key] = true;
          schedulePush(1000);
        }
      }

      function pendingItems() {
        var items = {};
        Object.keys(PENDING).forEach(function (k) { items[k] = { v: MEMORY_CACHE[k], t: KEY_TS[k] }; });
        return items;
      }

      function schedulePush(ms) { clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, ms); }

      function mergeUsersRemote() {
        return fetch(BACKEND_URL).then(function (r) { return r.json(); }).then(function (remote) {
          var it = remote && remote["copa_users_v2"];
          if (!it || !it.v) return;
          var merged = unionUsers(it.v, MEMORY_CACHE["copa_users_v2"] || []);
          if (JSON.stringify(merged) !== JSON.stringify(MEMORY_CACHE["copa_users_v2"])) {
            KEY_TS["copa_users_v2"] = Date.now();
            persistLocal("copa_users_v2", merged);
            (STATE_LISTENERS["copa_users_v2"] || []).forEach(function (fn) { fn(merged); });
          }
        }).catch(function () {});
      }

      function pushNow() {
        if (!BACKEND_URL) return;
        if (PENDING["copa_users_v2"] && !USERS_FORCE) { mergeUsersRemote().then(pushNow2); } else { pushNow2(); }
      }

      function pushNow2() {
        var items = pendingItems();
        var keys = Object.keys(items);
        if (!keys.length) return;
        fetch(BACKEND_URL, { method: "POST", body: JSON.stringify({ key: SYNC_KEY, items: items }) })
          .then(function (r) { return r.json(); })
          .then(function (res) {
            if (res && res.ok) {
              keys.forEach(function (k) { if (KEY_TS[k] === items[k].t) delete PENDING[k]; });
              if (!PENDING["copa_users_v2"]) USERS_FORCE = false;
              setSyncStatus("ok");
            } else { setSyncStatus(res && res.error === "clave" ? "key" : "err", (res && res.error === "clave" && res.esperada !== undefined) ? " (la app envía " + res.recibida + " caracteres; el script espera " + res.esperada + ")" : ""); schedulePush(8000); }
          })
          .catch(function () { setSyncStatus("err"); schedulePush(8000); });
      }

      function pullRemote() {
        if (!BACKEND_URL) return Promise.resolve();
        return fetch(BACKEND_URL).then(function (r) { return r.json(); }).then(function (remote) {
          remote = remote || {};
          var seeded = false;
          Object.keys(Object.assign({}, remote, MEMORY_CACHE)).filter(isSync).forEach(function (k) {
            var it = remote[k];
            if (PENDING[k]) return;
            if (it && (it.t || 0) > (KEY_TS[k] || 0)) {
              KEY_TS[k] = it.t;
              persistLocal(k, it.v);
              (STATE_LISTENERS[k] || []).forEach(function (fn) { fn(it.v); });
            } else if (!it && MEMORY_CACHE[k] !== undefined) {
              KEY_TS[k] = KEY_TS[k] || Date.now();
              PENDING[k] = true;
              seeded = true;
            }
          });
          persistLocal("copa_key_ts_v2", KEY_TS);
          if (seeded) schedulePush(500);
          if (!Object.keys(PENDING).length) setSyncStatus("ok");
        }).catch(function () { setSyncStatus("err"); });
      }

      window.addEventListener("pagehide", function () {
        try {
          clearTimeout(_cacheTimer);
          cacheStorageSaveNow();
          if (BACKEND_URL && Object.keys(PENDING).length) {
            navigator.sendBeacon(BACKEND_URL, JSON.stringify({ key: SYNC_KEY, items: pendingItems() }));
          }
        } catch (e) {}
      });

      function useStickyState(defaultValue, rawKey) {
        const key = React.useRef(ck(rawKey)).current;
        const [value, setValue] = useState(function () {
          return safeGetStorage(key, defaultValue);
        });
        const firstRun = React.useRef(true);

        useEffect(function () {
          if (!STATE_LISTENERS[key]) STATE_LISTENERS[key] = [];
          STATE_LISTENERS[key].push(setValue);
          return function () {
            STATE_LISTENERS[key] = (STATE_LISTENERS[key] || []).filter(function (fn) { return fn !== setValue; });
          };
        }, [key]);

        // Se guarda DESPUÉS de cada cambio real de estado (nunca dentro del updater)
        useEffect(function () {
          if (firstRun.current) { firstRun.current = false; return; }
          if (MEMORY_CACHE[key] === value) return;
          safeSetStorage("copa_last_saved_ts_v2", Date.now());
          safeSetStorage("copa_has_user_edits_v2", true);
          safeSetStorage(key, value);
          (STATE_LISTENERS[key] || []).forEach(function (fn) { if (fn !== setValue) fn(value); });
        }, [value]);

        return [value, setValue];
      }

      // 10 EQUIPOS OFICIALES DEL CAMPEONATO
      const INITIAL_TEAMS = [
        {
          id: "t1",
          name: "100% FIELES",
          color: "#2563eb",
          badge: "🦁",
          logoUrl: "",
          captainName: "",
          captainEmail: "",
          captain2Name: "",
          captain2Phone: "",
          players: [
            { id: "p1", name: "JUGADOR 1 (100% FIELES)", number: 10, pos: "DEL", goals: 0, assists: 0, yellow: 0, red: 0, mvp: 0, sancion: 0 },
            { id: "p2", name: "ARQUERO (100% FIELES)", number: 1, pos: "ARQ", goals: 0, assists: 0, yellow: 0, red: 0, mvp: 0, sancion: 0 }
          ]
        },
        {
          id: "t2",
          name: "BROTHERS OF THE HOOK",
          color: "#ea580c",
          badge: "🪝",
          logoUrl: "",
          captainName: "CAPITAN BROTHERS",
          captainEmail: "",
          captain2Name: "",
          captain2Phone: "",
          players: [
            { id: "p3", name: "JUGADOR 1 (BROTHERS)", number: 9, pos: "DEL", goals: 0, assists: 0, yellow: 0, red: 0, mvp: 0, sancion: 0 },
            { id: "p4", name: "JUGADOR 2 (BROTHERS)", number: 5, pos: "DEF", goals: 0, assists: 0, yellow: 0, red: 0, mvp: 0, sancion: 0 }
          ]
        },
        {
          id: "t3",
          name: "MANTENIMIENTO UNITED",
          color: "#059669",
          badge: "🔧",
          logoUrl: "",
          captainName: "CAPITAN MANT",
          captainEmail: "",
          captain2Name: "",
          captain2Phone: "",
          players: [
            { id: "p5", name: "JUGADOR 1 (MANTENIMIENTO)", number: 7, pos: "DEL", goals: 0, assists: 0, yellow: 0, red: 0, mvp: 0, sancion: 0 },
            { id: "p6", name: "JUGADOR 2 (MANTENIMIENTO)", number: 8, pos: "MED", goals: 0, assists: 0, yellow: 0, red: 0, mvp: 0, sancion: 0 }
          ]
        },
        {
          id: "t4",

      function buildRoundRobinMatches(teamList) {
        const list = [...teamList];
        if (list.length % 2 !== 0) {
          list.push({ id: "BYE", name: "Descanso" });
        }
        const numRounds = list.length - 1;
        const half = list.length / 2;
        const matches = [];
        let matchCounter = 1;
        for (let r = 0; r < numRounds; r++) {
          for (let i = 0; i < half; i++) {
            const tA = list[i];
            const tB = list[list.length - 1 - i];
            if (tA.id !== "BYE" && tB.id !== "BYE") {
              matches.push({
                id: "m_" + (r + 1) + "_" + (i + 1),
                order: matchCounter++,
                round: "Fecha " + (r + 1),
                stage: "Todos contra Todos",
                t1: (i === 0 && r % 2 === 1) ? tB.id : tA.id,
                t2: (i === 0 && r % 2 === 1) ? tA.id : tB.id,
                score1: 0,
                score2: 0,
                status: "Por jugar",
                time: "Sáb " + (8 + i) + ":00",
                court: "Cancha Principal",
                isSubmitted: false,
                refereeReport: "",
                vocalReport: "",
                vocalTeamId: "",
                lineups: { t1: [], t2: [] }
              });
            }
          }
          list.splice(1, 0, list.pop());
        }
        return matches;
      }

      const INITIAL_MATCHES = buildRoundRobinMatches(INITIAL_TEAMS);

const ADMIN_HASH = "7e14e71409792a4c3811f30eaccc507ebed66c3fddced831aeac3178503414e5";
      function sha256Hex(s) {
        return crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)).then(function (b) {
          return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, "0"); }).join("");
        });
      }

            reader.onloadend = function () {
              // Comprimir imagen automáticamente para que no sature el almacenamiento al guardar
              const img = new Image();
              img.onload = function () {
                try {
                  const canvas = document.createElement("canvas");
                  const maxDim = 320;
                  let w = img.width;
                  let hSize = img.height;
                  if (w > hSize && w > maxDim) {
                    hSize = Math.round((hSize * maxDim) / w);
                    w = maxDim;
                  } else if (hSize > maxDim) {
                    w = Math.round((w * maxDim) / hSize);
                    hSize = maxDim;
                  }
                  canvas.width = w;
                  canvas.height = hSize;
                  const ctx = canvas.getContext("2d");
                  ctx.drawImage(img, 0, 0, w, hSize);
                  try {
                    const idata = ctx.getImageData(0, 0, w, hSize), d = idata.data;
                    const near = function (i) { return d[i + 3] === 0 || (d[i] > 235 && d[i + 1] > 235 && d[i + 2] > 235); };
                    const seen = new Uint8Array(w * hSize), stack = [];
                    const push = function (x, y) { const k = y * w + x; if (!seen[k] && near(k * 4)) { seen[k] = 1; stack.push(k); } };
                    for (let x = 0; x < w; x++) { push(x, 0); push(x, hSize - 1); }
                    for (let y = 0; y < hSize; y++) { push(0, y); push(w - 1, y); }
                    while (stack.length) {
                      const k = stack.pop(); const x = k % w, y = (k - x) / w;
                      d[k * 4 + 3] = 0;
                      if (x > 0) push(x - 1, y); if (x < w - 1) push(x + 1, y); if (y > 0) push(x, y - 1); if (y < hSize - 1) push(x, y + 1);
                    }
                    ctx.putImageData(idata, 0, 0);
                  } catch (e2) {}
                  setNewTeamLogoUrl(canvas.toDataURL("image/png"));
                  showMsg("Emblema / Logo optimizado y cargado con éxito");
                } catch (err) {
                  setNewTeamLogoUrl(reader.result);
                  showMsg("Emblema / Logo cargado con éxito");
                }
              };
              img.onerror = function () {
                setNewTeamLogoUrl(reader.result);
                showMsg("Emblema / Logo cargado con éxito");
              };
              img.src = reader.result;
            };
            reader.readAsDataURL(file);
          }
        };

        const handleParsePdf = function (e) {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          setExcelStatus("⏳ Leyendo documento y extrayendo jugadores...");

          // Analizador inteligente de filas para extraer: NOMBRES Y APELLIDOS / EDAD / NRO CAMISETA
          const parseRowsToPlayers = function (rows) {
            const playersList = [];
            const ignoreRegex = /(NOMBRES|APELLIDOS|JUGADOR|CAMISETA|EDAD|CEDULA|CÉDULA|FIRMA|NRO|N°|ITEM|EQUIPO|HOJA|INSCRIPCION|INSCRIPCIÓN|CAPITAN|CAPITÁN|CELULAR|TELEFONO|TELÉFONO|FECHA|campeonato|indorfutbol|indorfútbol|departamento|area|área|observacion|responsable)/i;

            rows.forEach(function (row) {
              const cells = row.map(function (c) { return String(c || "").trim(); }).filter(Boolean);
              if (cells.length === 0) return;
              const fullLine = cells.join(" ");

              // Detectar Capitán y Celular si vienen en el encabezado de la hoja
              const capMatch = fullLine.match(/CAPIT[AÁ]N\s*1?\s*[:\-]?\s*([A-ZÁÉÍÓÚÑ\s]{5,})/i);
              if (capMatch && capMatch[1]) {
                const cleanCap = capMatch[1].replace(/(CELULAR|TELEFONO|TELÉFONO|CORREO).*$/i, "").trim().toUpperCase();
                if (cleanCap.length >= 4) setNewCaptainName(cleanCap);
              }
              const phoneMatch = fullLine.match(/(09\d{8})/);
              if (phoneMatch && phoneMatch[1]) {
                setNewCaptainEmail(phoneMatch[1]);
              }

              // Buscar un nombre válido en las celdas de la fila
              let candidateName = "";
              let numsInRow = [];

              cells.forEach(function (cell) {
                // Si la celda contiene texto con letras (posible nombre)
                const cleanText = cell.replace(/[0-9#º°\-_.,:/()]/g, " ").replace(/\s+/g, " ").trim().toUpperCase();
                const words = cleanText.split(" ").filter(function (w) { return w.length >= 2; });
                if (words.length >= 2 && !ignoreRegex.test(cleanText) && cleanText.length > candidateName.length) {
                  candidateName = words.join(" ");
                }

                // Extraer números cortos (1 a 2 dígitos) de la fila (para índice, edad y camiseta)
                const matches = cell.match(/\b\d{1,2}\b/g);
                if (matches) {
                  matches.forEach(function (m) {
                    numsInRow.push(parseInt(m, 10));
                  });
                }
              });

              // Si toda la línea estaba unida en un solo bloque de texto PDF
              if (!candidateName) {
                const lineLetters = fullLine.replace(/[0-9#º°\-_.,:/()]/g, " ").replace(/\s+/g, " ").trim().toUpperCase();
                const lineWords = lineLetters.split(" ").filter(function (w) { return w.length >= 2 && !/^(DEL|MED|DEF|ARQ|GK)$/.test(w); });
                if (lineWords.length >= 2 && !ignoreRegex.test(lineLetters)) {
                  candidateName = lineWords.join(" ");
                }
              }

              if (candidateName && candidateName.length >= 5) {
                // Evitar duplicados
                if (playersList.some(function (p) { return p.name === candidateName; })) return;

                let age = "";
                let shirtNumber = playersList.length + 1;

                // Lógica para distinguir N° de lista, Edad del jugador y Nro de Camiseta:
                // Usualmente en la tabla: [N° Item] | [NOMBRES Y APELLIDOS] | [EDAD] | [NRO CAMISETA]
                if (numsInRow.length >= 3) {
                  age = numsInRow[numsInRow.length - 2];
                  shirtNumber = numsInRow[numsInRow.length - 1];
                } else if (numsInRow.length === 2) {
                  const n1 = numsInRow[0];
                  const n2 = numsInRow[1];
                  // Si el primero parece edad (18-65)
                  if (n1 >= 18 && n1 <= 65) {
                    age = n1;
                    shirtNumber = n2;
                  } else if (n2 >= 18 && n2 <= 65 && n1 === playersList.length + 1) {
                    age = n2;
                    shirtNumber = n1;
                  } else {
                    age = n1;
                    shirtNumber = n2;
                  }
                } else if (numsInRow.length === 1) {
                  shirtNumber = numsInRow[0];
                }

                playersList.push({
                  id: "px_" + Date.now() + "_" + (playersList.length + 1),
                  name: candidateName,
                  age: age !== "" ? age : "",
                  number: shirtNumber,
                  pos: "JUG",
                  goals: 0,
                  assists: 0,
                  yellow: 0,
                  red: 0,
                  mvp: 0,
                  sancion: 0
                });
              }
            });

            return playersList;
          };

          const ext = file.name.split(".").pop().toLowerCase();

          // 1. Si es archivo Excel (.xlsx / .xls / .csv)
          if (ext === "xlsx" || ext === "xls" || ext === "csv") {
            const reader = new FileReader();
            reader.onload = function (evt) {
              try {
                const data = new Uint8Array(evt.target.result);
                const workbook = window.XLSX.read(data, { type: "array" });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rows = window.XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                const extracted = parseRowsToPlayers(rows);
                if (extracted.length > 0) {
                  setImportedPlayers(extracted);
                  setExcelStatus("✅ Nómina leída con éxito: " + extracted.length + " jugadores extraídos.");
                  showMsg("✅ " + extracted.length + " jugadores extraídos del Excel");
                } else {
                  setExcelStatus("⚠️ No se detectaron filas con nombres válidos en el Excel.");
                }
              } catch (err) {
                console.error(err);
                setExcelStatus("❌ Error al procesar el archivo Excel.");
              }
            };
            reader.readAsArrayBuffer(file);
            return;
          }

          // 2. Si es archivo PDF (.pdf)
          if (ext === "pdf" && window.pdfjsLib) {
            window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
            const reader = new FileReader();
            reader.onload = function (evt) {
              const typedarray = new Uint8Array(evt.target.result);
              window.pdfjsLib.getDocument({ data: typedarray }).promise.then(function (pdf) {
                const pagePromises = [];
                for (let p = 1; p <= pdf.numPages; p++) {
                  pagePromises.push(
                    pdf.getPage(p).then(function (page) {
                      return page.getTextContent().then(function (textContent) {
                        // Agrupar fragmentos de texto por su coordenada vertical (Y) para reconstruir cada fila de la tabla
                        const yGroups = {};
                        textContent.items.forEach(function (item) {
                          const text = (item.str || "").trim();
                          if (!text) return;
                          const y = Math.round(item.transform[5] / 4) * 4;
                          const x = item.transform[4];
                          if (!yGroups[y]) yGroups[y] = [];
                          yGroups[y].push({ x: x, text: text });
                        });
                        // Ordenar de arriba hacia abajo y de izquierda a derecha
                        const sortedY = Object.keys(yGroups).map(Number).sort(function (a, b) { return b - a; });
                        return sortedY.map(function (y) {
                          const rowItems = yGroups[y].sort(function (a, b) { return a.x - b.x; });
                          return rowItems.map(function (it) { return it.text; });
                        });
                      });
                    })
                  );
                }
                Promise.all(pagePromises).then(function (pagesRows) {
                  const allRows = [];
                  pagesRows.forEach(function (pr) {
                    pr.forEach(function (r) { allRows.push(r); });
                  });
                  const extracted = parseRowsToPlayers(allRows);
                  if (extracted.length > 0) {
                    setImportedPlayers(extracted);
                    setExcelStatus("✅ Nómina PDF leída con éxito: " + extracted.length + " jugadores extraídos.");
                    showMsg("✅ " + extracted.length + " jugadores extraídos del PDF");
                  } else {
                    setExcelStatus("⚠️ El PDF parece ser una imagen escaneada sin texto seleccionable. Ingresa los jugadores manualmente.");
                  }
                }).catch(function (err) {
                  console.error(err);
                  setExcelStatus("❌ No se pudo leer el contenido del PDF.");
                });
              }).catch(function (err) {
                console.error(err);
                setExcelStatus("❌ Error al abrir el documento PDF.");
              });
            };
            reader.readAsArrayBuffer(file);
          }
        };

                            const np = crypto.getRandomValues(new Uint32Array(1))[0].toString(36).slice(0, 6);
                            hashPass(u.email, np).then(function (ph) {
                              setUsers(users.map(function (x) { return x.email === u.email ? Object.assign({}, x, { passHash: ph, password: undefined }) : x; }));
                              sendMail("clave_temporal", u.email, u.name, np);
                            });
                            showMsg("🔑 Nueva clave de " + u.name + ": " + np, 15000);
                          },
                          className: "text-[10px] text-emerald-600 font-bold mt-1"
                        }, "Restablecer clave")
                      ),
                      u.role !== "admin" && h("button", {
                        onClick: function () {
                          USERS_FORCE = true;
                          setUsers(users.filter(function (usr) { return usr.email !== u.email; }));
                          showMsg("Usuario eliminado");
                        },
                        className: "text-[10px] bg-rose-100 text-rose-700 font-bold px-2 py-1 rounded"
                      }, "Borrar")
                    );
                  })
                )
              )
            ),

            // MODAL 5: FLYER COMPARTIBLE
            flyerMatch && h("div", { className: "fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" },
              h("div", { className: "bg-gradient-to-br from-slate-950 via-emerald-950 to-slate-900 w-full max-w-sm rounded-3xl p-6 shadow-2xl text-white space-y-4 border border-emerald-500/40 relative" },
                h("div", { className: "flex justify-between items-center" },
                  h("span", { className: "bg-emerald-500 text-slate-950 text-[10px] font-black px-3 py-1 rounded-full uppercase" }, BRAND.code + " • ", flyerMatch.round),
                  h("button", { onClick: function () { setFlyerMatch(null); }, className: "text-slate-400 hover:text-white font-black text-lg" }, "✕")
                ),
                h("div", { className: "text-center space-y-1" },
                  h("div", { className: "text-xs text-emerald-300 font-extrabold uppercase tracking-widest" }, "Campeonato Corporativo 2026"),
                  h("h3", { className: "text-lg font-black tracking-wide" }, "GRAN ENCUENTRO")
                ),
                h("div", { className: "bg-white/10 backdrop-blur rounded-2xl p-4 border border-white/15 flex justify-between items-center text-center" },
                  h("div", { className: "w-2/5 flex flex-col items-center gap-1.5" },
                    getTeam(flyerMatch.t1).logoUrl ? h("img", { src: getTeam(flyerMatch.t1).logoUrl, className: "w-12 h-12 object-contain", alt: "" }) : h("span", { className: "text-3xl" }, getTeam(flyerMatch.t1).badge),
                    h("span", { className: "text-[11px] font-black leading-tight" }, getTeam(flyerMatch.t1).name)
                  ),
                  h("div", { className: "w-1/5" },
                    h("span", { className: "text-xs font-black bg-emerald-400 text-slate-950 px-2 py-1 rounded-xl shadow" }, "VS")
                  ),
                  h("div", { className: "w-2/5 flex flex-col items-center gap-1.5" },
                    getTeam(flyerMatch.t2).logoUrl ? h("img", { src: getTeam(flyerMatch.t2).logoUrl, className: "w-12 h-12 object-contain", alt: "" }) : h("span", { className: "text-3xl" }, getTeam(flyerMatch.t2).badge),
                    h("span", { className: "text-[11px] font-black leading-tight" }, getTeam(flyerMatch.t2).name)
                  )
                ),
                h("div", { className: "bg-slate-900/80 p-3 rounded-2xl text-center border border-white/10 space-y-1" },
                  h("div", { className: "text-[11px] font-bold text-slate-300" }, "📅 ", flyerMatch.customDateTime || (flyerMatch.round + " • " + flyerMatch.time)),
                  h("div", { className: "text-[11px] font-bold text-emerald-400" }, "🏟️ Cancha Principal • " + BRAND.code),
                  h("div", { className: "text-[11px] font-bold text-amber-300 pt-1 border-t border-white/10" }, "📋 Vocal: ", flyerMatch.vocalTeamId ? getTeam(flyerMatch.vocalTeamId).name : "Por asignar")
                ),
                h("button", {
                  onClick: function () {
                    showMsg("📲 Flyer listo para compartir en WhatsApp");
                    setFlyerMatch(null);
                  },
                  className: "w-full bg-emerald-400 hover:bg-emerald-300 text-slate-950 font-black py-3.5 rounded-2xl text-xs shadow-lg transition"
                }, "COMPARTIR FLYER 📲")
              )
            )
          )
        );
      }

      // Cargar toda la información guardada (IndexedDB + CacheStorage + window.name + localStorage) ANTES de montar React
      // Así al actualizar la página nunca se reinicia ni regresa a la pantalla principal
      Promise.race([Promise.all([idbLoadAllPromise(), cacheStorageLoadAll()]), new Promise(function (res) { setTimeout(function () { res([{}, {}]); }, 3000); })]).then(function (results) {
        const idbData = results[0] || {};
        const cacheData = results[1] || {};
        const winData = getWindowNameStore();

        function readWeb(getter) {
          var o = {};
          try {
            var st = getter();
            for (var i = 0; i < st.length; i++) {
              var k = st.key(i);
              if (k && k.indexOf("copa_") === 0) { try { o[k] = JSON.parse(st.getItem(k)); } catch (e) {} }
            }
          } catch (e) {}
          return o;
        }
        const stores = [winData, cacheData, idbData, readWeb(function () { return window.sessionStorage; }), readWeb(function () { return window.localStorage; })].map(function (d, i) {
          return { d: d || {}, ts: (d && d["copa_last_saved_ts_v2"]) || 0, i: i };
        });
        // El almacén con el guardado más reciente se aplica al final y gana sobre los demás
        stores.sort(function (x, y) { return x.ts - y.ts || x.i - y.i; });
        stores.forEach(function (st) {
          Object.keys(st.d).forEach(function (k) {
            if (st.d[k] !== undefined && st.d[k] !== null) MEMORY_CACHE[k] = st.d[k];
          });
        });

        // Si había un usuario activo o se encontraba dentro de la app, mantenerlo en "app" al refrescar
        if (MEMORY_CACHE["copa_auth_user_v2"] && (!MEMORY_CACHE["copa_screen_v2"] || MEMORY_CACHE["copa_screen_v2"] === "landing" || MEMORY_CACHE["copa_screen_v2"] === "login")) {
          MEMORY_CACHE["copa_screen_v2"] = "app";
        }

        KEY_TS = MEMORY_CACHE["copa_key_ts_v2"] || {};
        Promise.race([pullRemote(), new Promise(function (res) { setTimeout(res, 4000); })]).then(function () {
          const root = ReactDOM.createRoot(document.getElementById("root"));
          root.render(h(Root, null));
          if (!BACKEND_URL) {
            var okLocal = false;
            try { window.localStorage.setItem("__t", "1"); window.localStorage.removeItem("__t"); okLocal = true; } catch (e) {}
            setSyncStatus(okLocal ? "none" : "nolocal");
          }
          if (BACKEND_URL) {
            setInterval(pullRemote, 20000);
            document.addEventListener("visibilitychange", function () { if (!document.hidden) pullRemote(); });
          }
        });
      });
    })();
  </script>
</body>
</html>
